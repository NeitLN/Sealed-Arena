<!doctype html>
<!-- Source of public/og.png (the link-preview image). Rebuild: node og/render.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; background: #ffffff; color: #111111;
    font-family: Figtree, "Segoe UI", Arial, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 650; }
  .brand span span { color: #555555; font-weight: 500; }
  h1 { font-size: 76px; line-height: 1.06; margin: 0; align-self: center; max-width: 16ch; letter-spacing: -0.01em; }
  p { font-size: 32px; color: #555555; margin: 22px 0 0; }
  footer { display: flex; justify-content: space-between; font-size: 26px; color: #555555; border-top: 2px solid #ececec; padding-top: 24px; }
  footer b { color: #0f7f71; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="62" height="62" viewBox="0 0 32 32" fill="none">
      <title>Sealed Arena</title>
      <rect x="2" y="6" width="23" height="16" rx="3" stroke="#111111" stroke-width="2"/>
      <rect x="2" y="10" width="23" height="3" fill="#111111"/>
      <rect x="6" y="16.5" width="7" height="2" rx="1" fill="#111111" opacity=".45"/>
      <circle cx="24" cy="23" r="6" fill="#0f7f71"/>
      <path d="M21.2 23.1l2 2 3.7-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Sealed <span>Arena</span></span>
  </div>
  <div style="align-self:center">
    <h1>Give your agent a card, not the wallet.</h1>
    <p>Agent spending, owner-defined limits, checked by the chain.</p>
  </div>
  <footer><span><b>Avalanche L1</b> · Fuji testnet</span><span>Testnet · no monetary value</span></footer>
</body>
</html>

name: public health

# Checks the public Fuji endpoints every 30 minutes. A failing run notifies the repository's
# maintainers by GitHub's own notification settings; there is no other alert channel.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/public-health.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The Foundry image runs as uid 1000; let it write build output into contracts/.
      - name: Allow the Foundry container to write build output
        run: chmod -R a+w contracts

      # typecheck, lint, TypeScript tests, forge build/test, and the Go tests of
      # the avalanchego patches (fetched at the pinned tag, run in Docker).
      - name: Run checks
        run: bash scripts/check.sh
